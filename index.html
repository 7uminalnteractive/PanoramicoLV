<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panorâmico do LV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14171C;
    --surface: #1C2028;
    --surface-raised: #232833;
    --border: #2C3240;
    --text: #E8E6DF;
    --text-dim: #8B92A0;
    --text-faint: #565D6B;
    --olive: #5C7A5C;
    --olive-bright: #7A9E7A;
    --gold: #B8874A;
    --gold-bright: #D4A66C;
    --red: #A6544A;
    --serif: 'Fraunces', serif;
    --sans: 'Inter', sans-serif;
    --radius: 10px;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; max-width: 100%; overflow-x: hidden; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    width: 100%;
  }

  ::selection{ background: var(--gold); color: #14171C; }

  a{ color: var(--gold-bright); }

  button{
    font-family: var(--sans);
    cursor: pointer;
  }

  input, textarea, select{
    font-family: var(--sans);
    background: var(--surface-raised);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
  }
  input[type="date"], input[type="datetime-local"], input[type="time"]{
    color-scheme: dark;
  }
  input[type="date"]::-webkit-calendar-picker-indicator,
  input[type="datetime-local"]::-webkit-calendar-picker-indicator,
  input[type="time"]::-webkit-calendar-picker-indicator{
    filter: invert(0.8);
    cursor: pointer;
  }
  select{
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238B92A0' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat: no-repeat;
    background-position: right 12px center;
    background-size: 16px;
    padding-right: 34px;
  }
  input:focus, textarea:focus, select:focus{
    outline: 2px solid var(--olive-bright);
    outline-offset: 1px;
  }
  textarea{ resize: vertical; font-family: var(--sans); line-height: 1.5; }

  /* ---------- Layout ---------- */
  .app{
    display: flex;
    min-height: 100vh;
    width: 100%;
    max-width: 100%;
  }

  .sidebar{
    width: 220px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 24px 0;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }

  .brand{
    padding: 0 20px 20px 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 14px;
  }
  .brand-mark{
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.2px;
    color: var(--text);
  }
  .brand-sub{
    font-size: 11.5px;
    color: var(--text-faint);
    margin-top: 3px;
  }

  .nav{
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 0 10px;
    flex: 1;
  }
  .nav-btn{
    display: flex;
    align-items: center;
    gap: 11px;
    background: none;
    border: none;
    color: var(--text-dim);
    text-align: left;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    transition: background .15s ease, color .15s ease;
  }
  .nav-btn:hover{ background: var(--surface-raised); color: var(--text); }
  .nav-btn.active{
    background: var(--surface-raised);
    color: var(--text);
  }
  .nav-btn.active .nav-ico{ color: var(--gold-bright); }
  .nav-ico{ width: 18px; height: 18px; flex-shrink: 0; color: var(--text-faint); }
  .nav-btn:hover .nav-ico, .nav-btn.active .nav-ico{ color: var(--gold-bright); }

  .main{
    flex: 1;
    min-width: 0;
    padding: 0 40px 80px;
  }

  .topbar{
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    padding: 18px 0;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }
  .topbar-brand{
    display: none;
    font-family: var(--serif);
    font-size: 17px;
    font-weight: 600;
  }

  .menu-wrap{ position: relative; }

  .hamburger-btn{
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-dim);
    transition: background .15s ease, color .15s ease;
  }
  .hamburger-btn:hover{ background: var(--surface-raised); color: var(--text); }
  .hamburger-btn svg{ width: 19px; height: 19px; }

  .menu-dropdown{
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px;
    min-width: 180px;
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
    z-index: 20;
  }
  .menu-dropdown.open{ display: flex; flex-direction: column; gap: 2px; }

  .menu-item{
    background: none;
    border: none;
    color: var(--text);
    text-align: left;
    padding: 9px 10px;
    border-radius: 6px;
    font-size: 13.5px;
    font-weight: 500;
  }
  .menu-item:hover{ background: var(--border); }

  .view{ display: none; max-width: 920px; margin: 0 auto; }
  .view.active{ display: block; animation: fadeIn .25s ease; }

  @keyframes fadeIn{
    from{ opacity: 0; transform: translateY(4px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  .view-header{
    margin-bottom: 28px;
  }
  .view-title{
    font-family: var(--serif);
    font-size: 30px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .view-date{
    color: var(--text-faint);
    font-size: 13px;
  }

  .card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    max-width: 100%;
    overflow-wrap: break-word;
    word-break: break-word;
  }
  .card + .card{ margin-top: 16px; }

  .card-title{
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    margin: 0 0 14px;
  }

  .grid-2{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .btn{
    background: var(--olive);
    color: #fff;
    border: none;
    padding: 11px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    transition: background .15s ease, transform .1s ease;
  }
  .btn:hover{ background: var(--olive-bright); }
  .btn:active{ transform: scale(0.98); }
  .btn.secondary{
    background: var(--surface-raised);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn.secondary:hover{ background: var(--border); }
  .btn.danger{ background: var(--red); }
  .btn.danger:hover{ background: #c06456; }
  .btn.small{ padding: 7px 12px; font-size: 12.5px; }
  .btn:disabled{ opacity: 0.45; cursor: not-allowed; }

  .field{ display:flex; flex-direction:column; gap: 6px; margin-bottom: 14px; }
  .field label{ font-size: 12.5px; color: var(--text-dim); font-weight: 500; }

  .inline-form{
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .inline-form input, .inline-form select{
    flex: 1;
    min-width: 140px;
  }
  .inline-form button{
    flex-shrink: 0;
  }
  @media (max-width: 480px){
    .inline-form input, .inline-form select{ min-width: 100%; }
    .inline-form button{ width: 100%; }
  }

  .empty{
    color: var(--text-faint);
    font-size: 13.5px;
    padding: 18px 0;
    text-align: center;
  }

  .table-scroll{
    width: 100%;
    max-width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  table{ width: 100%; min-width: 480px; border-collapse: collapse; font-size: 13.5px; }
  th{
    text-align: left;
    color: var(--text-faint);
    font-weight: 500;
    font-size: 11.5px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
  }
  td{
    padding: 10px 10px;
    border-bottom: 1px solid var(--border);
  }
  tr:last-child td{ border-bottom: none; }

  .tag{
    display: inline-block;
    padding: 2px 9px;
    border-radius: 100px;
    font-size: 11px;
    font-weight: 600;
  }
  .tag.ok{ background: rgba(92,122,92,.25); color: var(--olive-bright); }
  .tag.warn{ background: rgba(184,135,74,.25); color: var(--gold-bright); }
  .tag.bad{ background: rgba(166,84,74,.25); color: #D08277; }

  ::-webkit-scrollbar{ width: 10px; height: 10px; }
  ::-webkit-scrollbar-track{ background: transparent; }
  ::-webkit-scrollbar-thumb{ background: var(--border); border-radius: 10px; }

  /* Mobile */

  @media (max-width: 820px){
    .app{ flex-direction: column; }
    .sidebar{
      position: fixed;
      bottom: 0; left: 0; right: 0;
      top: auto;
      height: auto;
      width: 100%;
      flex-direction: row;
      padding: 6px 4px;
      border-right: none;
      border-top: 1px solid var(--border);
      z-index: 50;
      overflow-x: auto;
    }
    .brand{ display: none; }
    .sidebar{ flex-direction: row; align-items: center; }
    .nav{ flex-direction: row; padding: 0; width: 100%; }
    .nav-btn{ flex-direction: column; gap: 3px; font-size: 10px; padding: 8px 6px; border-radius: 8px; flex: 1; min-width: 62px; text-align: center; }
    .nav-btn span.nav-label{ white-space: nowrap; }
    .main{ padding: 0 16px 100px; }
    .topbar{ padding: 14px 0; justify-content: space-between; }
    .topbar-brand{ display: block; }
    .grid-2{ grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="app">
  <nav class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">Panorâmico do LV</div>
      <div class="brand-sub">painel pessoal</div>
    </div>
    <div class="nav" id="navList"></div>
  </nav>

  <main class="main">
    <div class="topbar">
      <div class="topbar-brand">Panorâmico do LV</div>
      <div class="menu-wrap">
        <button class="hamburger-btn" id="btnMenu" aria-label="Menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="menu-dropdown" id="menuDropdown">
          <button class="menu-item" id="btnExportar">Exportar backup</button>
          <button class="menu-item" id="btnImportar">Importar backup</button>
          <input type="file" id="inputImportar" accept="application/json" style="display:none;">
        </div>
      </div>
    </div>
    <div id="views"></div>
  </main>
</div>

<script>
// ============ ESTADO / STORAGE ============
const STORE_KEY = 'panoramico_lv_v1';

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ console.error('Erro ao carregar estado', e); }
  return defaultState();
}

function defaultState(){
  return {
    sobriedade: { inicio: '2026-08-31', ultimaConfirmacao: '2026-09-13' },
    biblia: { ultimoVersiculoData: null, versiculo: null, historico: [] },
    futebol: { jogos: [] },
    escola: {
      materias: [], // {id, nome, ciclo1: [notas], ciclo2: [notas], mediaNecessaria: 6}
      aulasHoje: [] // array de strings, resetável manualmente
    },
    jornalista: { textos: [] },
    fisk: { pagina: '' },
    programacao: { prompts: [] },
    claude: { contas: [] },
    academia: { treinos: [], treinosGoleiro: [] }
  };
}

let state = loadState();

function saveState(){
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
}

function uid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10); // YYYY-MM-DD
}

function formatDateBR(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function daysBetween(iso){
  if(!iso) return 0;
  const start = new Date(iso + 'T00:00:00');
  const now = new Date();
  const diff = Math.floor((now - start) / (1000*60*60*24));
  return diff < 0 ? 0 : diff;
}

// ============ NAVEGAÇÃO ============
const TABS = [
  { id: 'inicio', label: 'Início', icon: 'home' },
  { id: 'sobriedade', label: 'Sobriedade', icon: 'shield' },
  { id: 'biblia', label: 'Bíblia', icon: 'book' },
  { id: 'futebol', label: 'Futebol', icon: 'ball' },
  { id: 'escola', label: 'Escola', icon: 'grad' },
  { id: 'jornalista', label: 'Jornalista', icon: 'pen' },
  { id: 'fisk', label: 'Fisk', icon: 'lang' },
  { id: 'programacao', label: 'Programação', icon: 'code' },
  { id: 'claude', label: 'Claude', icon: 'spark' },
  { id: 'academia', label: 'Academia', icon: 'dumbbell' },
];

const ICONS = {
  home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/>',
  shield: '<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/>',
  book: '<path d="M4 5.5c2-1 5-1 8 0v14c-3-1-6-1-8 0v-14z"/><path d="M20 5.5c-2-1-5-1-8 0v14c3-1 6-1 8 0v-14z"/>',
  ball: '<circle cx="12" cy="12" r="9"/><path d="M12 7l3.5 2.5-1.3 4.1H9.8L8.5 9.5 12 7z"/><path d="M12 3v4M3.5 9l3.5 1M20.5 9l-3.5 1M6 19l2.5-3.5M18 19l-2.5-3.5"/>',
  grad: '<path d="M2 8l10-4.5L22 8l-10 4.5L2 8z"/><path d="M6 10.5V16c0 1.5 2.5 3 6 3s6-1.5 6-3v-5.5"/>',
  pen: '<path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/><path d="M14 6l3 3"/>',
  lang: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.2 2.3 3.5 5.6 3.5 9s-1.3 6.7-3.5 9c-2.2-2.3-3.5-5.6-3.5-9s1.3-6.7 3.5-9z"/>',
  code: '<path d="M9 8l-5 4 5 4M15 8l5 4-5 4"/>',
  spark: '<path d="M12 3l1.8 5.4L19 10l-5.2 1.6L12 17l-1.8-5.4L5 10l5.2-1.6L12 3z"/>',
  dumbbell: '<path d="M4 9v6M2 10.5v3M7 7v10M17 7v10M20 10.5v3M22 9v6"/><path d="M7 12h10"/>',
};

function iconSvg(name){
  return `<svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`;
}

let currentTab = 'inicio';

function renderNav(){
  const nav = document.getElementById('navList');
  nav.innerHTML = TABS.map(t => `
    <button class="nav-btn ${t.id===currentTab?'active':''}" data-tab="${t.id}">
      ${iconSvg(t.icon)}<span class="nav-label">${t.label}</span>
    </button>
  `).join('');
  nav.querySelectorAll('.nav-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> switchTab(btn.dataset.tab));
  });
}

function switchTab(tabId){
  currentTab = tabId;
  renderNav();
  renderView();
  window.scrollTo(0,0);
}

function renderView(){
  const container = document.getElementById('views');
  const renderers = {
    inicio: renderInicio,
    sobriedade: renderSobriedade,
    biblia: renderBiblia,
    futebol: renderFutebol,
    escola: renderEscola,
    jornalista: renderJornalista,
    fisk: renderFisk,
    programacao: renderProgramacao,
    claude: renderClaude,
    academia: renderAcademia,
  };
  container.innerHTML = `<div class="view active" id="view-${currentTab}"></div>`;
  const el = document.getElementById(`view-${currentTab}`);
  renderers[currentTab](el);
}

// ============ SOBRIEDADE ============
const PATENTES_NOFAP = [
  { min: 1,  max: 1,  emoji: '🎽', nome: 'Soldado' },
  { min: 2,  max: 2,  emoji: '🎗️', nome: 'Cabo' },
  { min: 3,  max: 5,  emoji: '🥉', nome: 'Terceiro Tenente' },
  { min: 6,  max: 10, emoji: '🥈', nome: 'Segundo Tenente' },
  { min: 11, max: 13, emoji: '🥇', nome: 'Primeiro Sargento' },
  { min: 14, max: 15, emoji: '♠️', nome: 'Subtenente' },
  { min: 16, max: 20, emoji: '⚜️', nome: 'Aspirante a Oficial' },
  { min: 21, max: 23, emoji: '🏅', nome: 'Segundo Tenente' },
  { min: 24, max: 24, emoji: '🎖️', nome: 'Primeiro Tenente' },
  { min: 25, max: 25, emoji: '🎖️🎖️', nome: 'Capitão' },
  { min: 26, max: 26, emoji: '🎖️🎖️🎖️', nome: 'Major' },
  { min: 27, max: 27, emoji: '⭐', nome: 'Coronel' },
  { min: 28, max: 28, emoji: '⭐⭐', nome: 'General de Exército' },
  { min: 29, max: 29, emoji: '👑', nome: 'Rei' },
  { min: 30, max: Infinity, emoji: '♾️', nome: 'Monge' },
];

function patenteAtual(dias){
  if(dias <= 0) return null;
  return PATENTES_NOFAP.find(p => dias >= p.min && dias <= p.max) || PATENTES_NOFAP[PATENTES_NOFAP.length-1];
}

function proximaPatente(dias){
  return PATENTES_NOFAP.find(p => p.min > dias) || null;
}

function renderSobriedade(el){
  const s = state.sobriedade;
  const dias = s.inicio ? daysBetween(s.inicio) : 0;
  const jaConfirmouHoje = s.ultimaConfirmacao === todayStr();
  const patente = s.inicio ? patenteAtual(dias) : null;
  const proxima = s.inicio ? proximaPatente(dias) : null;

  el.innerHTML = `
    <div class="view-header">
      <h1 class="view-title">Sobriedade</h1>
      <div class="view-date">${new Date().toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'})}</div>
    </div>

    <div class="card" style="text-align:center; padding: 40px 22px;">
      ${s.inicio ? `
        <div style="font-family:var(--serif); font-size:76px; font-weight:600; line-height:1; color:var(--olive-bright);">${dias}</div>
        <div style="color:var(--text-dim); font-size:14px; margin-top:10px;">${dias === 1 ? 'dia sem pornografia' : 'dias sem pornografia'}</div>
        <div style="color:var(--text-faint); font-size:12px; margin-top:4px;">desde ${formatDateBR(s.inicio)}</div>

        ${patente ? `
          <div style="margin-top:26px; padding-top:24px; border-top:1px solid var(--border);">
            <div style="font-size:44px; line-height:1;">${patente.emoji}</div>
            <div style="font-family:var(--serif); font-size:20px; font-weight:600; margin-top:8px;">${patente.nome}</div>
            <div style="font-size:12px; color:var(--text-faint); margin-top:4px;">
              ${proxima ? `Faltam ${proxima.min - dias} dia${proxima.min-dias===1?'':'s'} para ${proxima.emoji} ${proxima.nome}` : 'Patente máxima alcançada'}
            </div>
          </div>
        ` : ''}
      ` : `
        <div style="color:var(--text-dim); font-size:15px; margin-bottom:18px;">Você ainda não começou a contagem.</div>
      `}

      <div style="margin-top:26px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
        ${s.inicio ? `
          <button class="btn" id="btnConfirmarDia" ${jaConfirmouHoje ? 'disabled' : ''}>
            ${jaConfirmouHoje ? 'Confirmado hoje ✓' : 'Confirmar mais um dia'}
          </button>
          <button class="btn danger" id="btnResetar">Recomeçar contagem</button>
        ` : `
          <button class="btn" id="btnIniciar">Começar contagem hoje</button>
        `}
      </div>
    </div>

    <div class="card">
      <div class="card-title">Patentes do NoFap</div>
      <div class="table-scroll">
      <table>
        <thead><tr><th>Dias</th><th>Patente</th></tr></thead>
        <tbody>
          ${PATENTES_NOFAP.map(p=>{
            const isAtual = patente && patente.nome === p.nome && dias >= p.min && dias <= p.max;
            const faixa = p.max === Infinity ? `${p.min}+ dias` : (p.min===p.max ? `${p.min} dia${p.min>1?'s':''}` : `${p.min}–${p.max} dias`);
            return `
              <tr style="${isAtual ? 'background: rgba(122,158,122,.12);' : ''}">
                <td>${faixa}</td>

const VERSICULOS_REF = [
  'João 3:16','Salmos 23:1','Provérbios 3:5-6','Romanos 8:28','Filipenses 4:13',
  'Josué 1:9','Isaías 41:10','Salmos 46:1','Mateus 6:33','Jeremias 29:11',
  'Salmos 118:24','2 Timóteo 1:7','Romanos 12:2','Gálatas 5:22-23','Salmos 27:1',
  'Provérbios 16:3','Isaías 40:31','1 Coríntios 13:4-7','Colossenses 3:23','Salmos 121:1-2',
  'Hebreus 11:1','Mateus 11:28','Salmos 34:18','Filipenses 4:6-7','Tiago 1:2-4'
];

async function fetchVersiculoDoDia(){
  const idx = Math.floor(Date.now() / 86400000) % VERSICULOS_REF.length;
  const ref = VERSICULOS_REF[idx];
  try{
    const res = await fetch(`https://bible-api.com/${encodeURIComponent(ref)}?translation=almeida`);
    if(!res.ok) throw new Error('fail');
    const data = await res.json();
    return { texto: data.text.trim(), referencia: data.reference };
  }catch(e){
    return { texto: 'Não foi possível carregar o versículo agora. Verifique sua conexão.', referencia: ref };
  }
}

async function garantirVersiculoDoDia(){
  const b = state.biblia;
  if(b.ultimoVersiculoData === todayStr() && b.versiculo && b.versiculo.traducao === 'almeida') return b.versiculo;
  const v = await fetchVersiculoDoDia();
  v.traducao = 'almeida';
  b.versiculo = v;
  b.ultimoVersiculoData = todayStr();
  if(!b.historico) b.historico = [];
  if(!b.historico.find(h=>h.referencia===v.referencia && h.data===todayStr())){
    b.historico.unshift({ ...v, data: todayStr() });
    b.historico = b.historico.slice(0, 30);
  }
  saveState();
  return v;
}

function mediaCiclo(notas){
  if(!notas || !notas.length) return null;
  const soma = notas.reduce((a,b)=>a+Number(b),0);
  return soma / notas.length;
}

function statusMateria(m){
  const media1 = mediaCiclo(m.ciclo1);
  const media2 = mediaCiclo(m.ciclo2);
  const necessaria = Number(m.mediaNecessaria || 6);
  const notasTotal = [...(m.ciclo1||[]), ...(m.ciclo2||[])];
  const mediaGeral = mediaCiclo(notasTotal);

  let faltaTexto = '—';
  let tag = '';
  if(mediaGeral !== null){
    const diff = necessaria - mediaGeral;
    if(diff <= 0){
      tag = '<span class="tag ok">aprovado</span>';
      faltaTexto = 'Já atingiu a média necessária';
    }else{
      tag = '<span class="tag warn">em andamento</span>';
      faltaTexto = `Falta ${diff.toFixed(1)} ponto${diff>1?'s':''} de média`;
    }
  }else{
    tag = '<span class="tag bad">sem notas</span>';
  }
  return { media1, media2, mediaGeral, tag, faltaTexto };
}

function renderProgramacao(el){

  el.innerHTML = `
    <div class="view-header">
      <h1 class="view-title">Programação</h1>

    </div>

          <label>Texto do prompt</label>
          <textarea name="texto" rows="5" placeholder="Escreva o prompt..." required></textarea>
        </div>
        <div class="field">
          <label>Imagem (opcional)</label>

        </div>
        <button type="submit" class="btn">Salvar</button>
      </form>
    </div>

    <div id="listaPrompts"></div>
  `;

  document.getElementById('formPrompt').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const texto = fd.get('texto');
    const arquivo = fd.get('imagem');
    let imagemData = null;
    let imagemNome = null;
    if(arquivo && arquivo.size > 0){
      imagemData = await new Promise((resolve,reject)=>{
        const reader = new FileReader();
        reader.onload = ()=>resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(arquivo);
      });
      imagemNome = arquivo.name;
    }
    state.programacao.prompts.push({
      id: uid(),
      texto,
      imagemData,
      imagemNome,
      criadoEm: new Date().toISOString()
    });
    saveState();
    renderView();
  });

  const listaEl = document.getElementById('listaPrompts');
  if(!prompts.length){
    listaEl.innerHTML = '<div class="card"><div class="empty">Nenhum prompt salvo ainda.</div></div>';
  }else{
    listaEl.innerHTML = prompts.map(p=>`
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:10px;">
          <div style="font-size:11.5px; color:var(--text-faint);">${new Date(p.criadoEm).toLocaleString('pt-BR')}</div>
          <div style="display:flex; gap:8px; flex-shrink:0;">
            <button class="btn secondary small" data-copyprompt="${p.id}">Copiar texto</button>
            ${p.imagemData ? `<button class="btn secondary small" data-downloadimg="${p.id}">Baixar imagem</button>` : ''}
            <button class="btn secondary small" data-delprompt="${p.id}">Excluir</button>
          </div>
        </div>
        <div style="font-size:13.5px; color:var(--text-dim); line-height:1.6; white-space:pre-wrap; margin-bottom:${p.imagemData?'12px':'0'};">${p.texto}</div>
        ${p.imagemData ? `<img src="${p.imagemData}" alt="${p.imagemNome||''}" style="max-width:100%; max-height:280px; border-radius:8px; border:1px solid var(--border);">` : ''}
      </div>
    `).join('');

    listaEl.querySelectorAll('[data-copyprompt]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const p = prompts.find(x=>x.id===btn.dataset.copyprompt);
        navigator.clipboard.writeText(p.texto).then(()=>{
          btn.textContent = 'Copiado ✓';
          setTimeout(()=>{ btn.textContent = 'Copiar texto'; }, 1500);
        });
      });
    });
    listaEl.querySelectorAll('[data-downloadimg]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const p = prompts.find(x=>x.id===btn.dataset.downloadimg);
        const a = document.createElement('a');
        a.href = p.imagemData;
        a.download = p.imagemNome || 'imagem.png';
        a.click();
      });
    });
    listaEl.querySelectorAll('[data-delprompt]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(confirm('Excluir este prompt?')){
          state.programacao.prompts = state.programacao.prompts.filter(x=>x.id!==btn.dataset.delprompt);
          saveState(); renderView();
        }
      });
    });
  }
}
// ============ CLAUDE ============
function verificarLimitesClaude(){
  const agora = new Date();
  let mudou = false;
  state.claude.contas.forEach(c=>{
    if(c.limitado && c.voltaEm && new Date(c.voltaEm) <= agora){
      c.limitado = false;
      c.voltaEm = null;
      mudou = true;
    }
  });
  if(mudou) saveState();
  return mudou;
}

function renderClaude(el){
  verificarLimitesClaude();
  const contas = state.claude.contas;

  el.innerHTML = `
    <div class="view-header">
      <h1 class="view-title">Claude</h1>
      <div class="view-date">contas e limites de uso</div>
    </div>

    <div class="card">
      <div class="card-title">Nova conta</div>
      <form id="formConta" class="inline-form">
        <input type="text" name="nome" placeholder="Nome da conta" required>
        <button type="submit" class="btn small">Adicionar</button>
      </form>
    </div>

    <div id="listaContas"></div>
  `;

  document.getElementById('formConta').addEventListener('submit',(e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    contas.push({ id: uid(), nome: fd.get('nome'), limitado: false, voltaEm: null });
    saveState();
    renderView();
  });

  const listaEl = document.getElementById('listaContas');
  if(!contas.length){
    listaEl.innerHTML = '<div class="card"><div class="empty">Nenhuma conta cadastrada ainda.</div></div>';
    return;
  }

  listaEl.innerHTML = contas.map(c=>`
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:${c.limitado?'14px':'0'};">
        <div style="font-family:var(--serif); font-size:17px; font-weight:600;">${c.nome}</div>
        <div style="display:flex; gap:8px; align-items:center;">
          ${c.limitado
            ? '<span class="tag bad">limite atingido</span>'
            : '<span class="tag ok">livre</span>'}
          <button class="btn secondary small" data-delconta="${c.id}">Excluir</button>
        </div>
      </div>
      ${c.limitado ? `
        <div style="font-size:12.5px; color:var(--text-dim); margin-bottom:12px;">
          Volta em: <strong style="color:var(--gold-bright);">${c.voltaEm ? new Date(c.voltaEm).toLocaleString('pt-BR') : '—'}</strong>
        </div>
        <button class="btn secondary small" data-liberar="${c.id}">Liberar agora</button>
      ` : `
        <form data-marcarlimite="${c.id}" style="display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap;">
          <div class="field" style="margin-bottom:0;">
            <label>Volta em (data e hora)</label>
            <input type="datetime-local" name="voltaEm" required>
          </div>
          <button type="submit" class="btn danger small">Limite atingido</button>
        </form>
      `}
    </div>
  `).join('');

  listaEl.querySelectorAll('[data-delconta]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(confirm('Excluir esta conta?')){
        state.claude.contas = state.claude.contas.filter(c=>c.id!==btn.dataset.delconta);
        saveState(); renderView();
      }
    });
  });
  listaEl.querySelectorAll('[data-liberar]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const c = contas.find(x=>x.id===btn.dataset.liberar);
      c.limitado = false; c.voltaEm = null;
      saveState(); renderView();
    });
  });
  listaEl.querySelectorAll('[data-marcarlimite]').forEach(form=>{
    form.addEventListener('submit',(e)=>{
      e.preventDefault();
      const fd = new FormData(form);
      const c = contas.find(x=>x.id===form.dataset.marcarlimite);
      c.limitado = true;
      c.voltaEm = new Date(fd.get('voltaEm')).toISOString();
      saveState(); renderView();
    });
  });
}

// ============ ACADEMIA ============
function renderListaTreinos(lista, key, containerEl){
  if(!lista.length){
    containerEl.innerHTML = '<div class="empty">Nenhum treino registrado ainda.</div>';
    return;
  }
  containerEl.innerHTML = lista.slice().sort((a,b)=>b.data.localeCompare(a.data)).map(t=>`
    <div style="padding:13px 0; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; gap:12px;">
      <div>
        <div style="font-size:13.5px; font-weight:600;">${t.nome}</div>
        <div style="font-size:12px; color:var(--text-dim); margin-top:3px; line-height:1.5;">${t.detalhes||''}</div>
        <div style="font-size:11px; color:var(--text-faint); margin-top:4px;">${formatDateBR(t.data)}</div>
      </div>
      <button class="btn secondary small" data-deltreino="${key}|${t.id}" style="height:fit-content;">Remover</button>
    </div>
  `).join('');
}

function renderAcademia(el){
  el.innerHTML = `
    <div class="view-header">
      <h1 class="view-title">Academia em casa</h1>
      <div class="view-date">treinos diários e treinos de goleiro</div>
    </div>

    <div class="card">
      <div class="card-title">Novo treino</div>
      <form id="formTreino">
        <div class="grid-2">
          <div class="field">
            <label>Tipo</label>
            <select name="tipo">
              <option value="diario">Treino diário</option>
              <option value="goleiro">Treino de goleiro</option>
            </select>
          </div>
          <div class="field">
            <label>Data</label>
            <input type="date" name="data" value="${todayStr()}" required>
          </div>
        </div>
        <div class="field">
          <label>Nome do treino</label>
          <input type="text" name="nome" placeholder="Ex: Treino de pernas" required>
        </div>
        <div class="field">
          <label>Detalhes (opcional)</label>
          <textarea name="detalhes" rows="3" placeholder="Séries, repetições, observações..."></textarea>
        </div>
        <button type="submit" class="btn">Adicionar treino</button>
      </form>
    </div>

    <div class="card">
      <div class="card-title">Treinos diários</div>
      <div id="listaTreinosDiarios"></div>
    </div>

    <div class="card">
      <div class="card-title">Treinos de goleiro</div>
      <div id="listaTreinosGoleiro"></div>
    </div>
  `;

  renderListaTreinos(state.academia.treinos, 'treinos', document.getElementById('listaTreinosDiarios'));
  renderListaTreinos(state.academia.treinosGoleiro, 'treinosGoleiro', document.getElementById('listaTreinosGoleiro'));

  function attachDelTreinoHandlers(){
    el.querySelectorAll('[data-deltreino]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const [key, id] = btn.dataset.deltreino.split('|');
        state.academia[key] = state.academia[key].filter(t=>t.id!==id);
        saveState(); renderView();
      });
    });
  }
  attachDelTreinoHandlers();

  document.getElementById('formTreino').addEventListener('submit',(e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const tipo = fd.get('tipo');
    const novo = { id: uid(), nome: fd.get('nome'), detalhes: fd.get('detalhes'), data: fd.get('data') };
    if(tipo === 'goleiro') state.academia.treinosGoleiro.push(novo);
    else state.academia.treinos.push(novo);
    saveState();
    renderView();
  });
}

// ============ INÍCIO ============

// ============ BACKUP (exportar / importar) ============
function exportarBackup(){
  const payload = {
    app: 'panoramico-lv',
    versao: 1,
    exportadoEm: new Date().toISOString(),
    dados: state
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const data = todayStr();
  a.href = url;
  a.download = `panoramico-lv-backup-${data}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importarBackup(file){
  const reader = new FileReader();
  reader.onload = () => {
    let payload;
    try{
      payload = JSON.parse(reader.result);
    }catch(e){
      alert('Arquivo inválido: não é um JSON legível.');
      return;
    }
    const dados = payload && payload.dados ? payload.dados : payload;
    if(!dados || typeof dados !== 'object' || !('sobriedade' in dados)){
      alert('Este arquivo não parece ser um backup válido do Panorâmico do LV.');
      return;
    }
    if(!confirm('Importar este backup vai substituir todos os dados atuais. Continuar?')){
      return;
    }
    state = dados;
    saveState();
    switchTab(currentTab);
    alert('Backup importado com sucesso.');
  };
  reader.onerror = () => alert('Não foi possível ler o arquivo.');
  reader.readAsText(file);
}

function wireBackupButtons(){
  const inputImportar = document.getElementById('inputImportar');
  const btnMenu = document.getElementById('btnMenu');
  const menuDropdown = document.getElementById('menuDropdown');

  const handleFile = (e) => {
    const file = e.target.files[0];
    if(file) importarBackup(file);
    e.target.value = '';
  };

  btnMenu.addEventListener('click', (e) => {
    e.stopPropagation();
    menuDropdown.classList.toggle('open');
  });

  document.addEventListener('click', (e) => {
    if(!menuDropdown.contains(e.target) && e.target !== btnMenu){
      menuDropdown.classList.remove('open');
    }
  });

  document.getElementById('btnExportar').addEventListener('click', () => {
    exportarBackup();
    menuDropdown.classList.remove('open');
  });
  document.getElementById('btnImportar').addEventListener('click', () => {
    inputImportar.click();
    menuDropdown.classList.remove('open');
  });
  inputImportar.addEventListener('change', handleFile);
}

renderNav();
renderView();
wireBackupButtons();

// Verifica a cada minuto se algum limite do Claude expirou, e re-renderiza se necessário
setInterval(()=>{
  const mudou = verificarLimitesClaude();
  if(mudou && (currentTab === 'claude' || currentTab === 'inicio')){
    renderView();
  }
}, 60000);
</script>
